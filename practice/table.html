<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="table.css">
    <title>Document</title>
</head>
<body>
    <h1>Table</h1>

    <!-- Example 1: Basic structure of the table -->
     <table>
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>12</td>
                <td>Shanee</td>
            </tr>
            <tr>
                <td>13</td>
                <td>John</td>
        </tbody>
     </table>

     <!-- Example 2: colspan and rowspan-->

     <h2>Weekly Schedule</h2>
     <p>colspan merges cells horizontally. rowspan merges cells vertically.</p>

     <table>
        <thead>
            <tr>
                <th colspan="3"> Weekend Shift</th>
            </tr>
            <tr>
                <th>Employee</th>
                <th>Saturday</th>
                <th>Sunday</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Bill Evans</td>
                <td>Morning</td>
                <td>Off</td>
            </tr>
            <tr>
                <td>Off</td>
                <td>Evening</td>
            </tr>
            <tr>
                <td>Laura Matt</td>
                <td>Evening</td>
                <td>Morning</td>
            </tr>
        </tbody>
     </table>

</body>
</html>
     </table>
</body>
</html>
